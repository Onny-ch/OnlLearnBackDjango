name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Run Flake8
        run: flake8 . --exclude=.venv,htmlcov,__pycache__,migrations,config,.github,test_settings.py

      - name: Run Black
        run: black .

      - name: Run Isort
        run: isort .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_myapp
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    needs: lint

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Wait for PostgreSQL readiness
      run: |
        for i in {1..10}; do
          PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql -U postgres -h localhost -p 5432 -c "SELECT 1;" && break
          echo "PostgreSQL not ready, waiting..."
          sleep 5
        done

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Reset PostgreSQL for tests
      run: |
        PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql -U postgres -h localhost -p 5432 -c "DROP DATABASE IF EXISTS test_myapp;"
        PGPASSWORD=${{ secrets.POSTGRES_PASSWORD }} psql -U postgres -h localhost -p 5432 -c "CREATE DATABASE test_myapp;"

    - name: Run migrations
      run: python manage.py migrate --settings=test_settings
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}


    - name: Run tests
      run: python manage.py test --settings=test_settings
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Accept SSH host key
        run: |
          mkdir -p ~/.ssh
          echo "89.169.175.36 ssh-ed25519 SHA256:o28XMs9yYVBvpEOfthxrMxwEpqbkG/HHHshoWU8RSJk" >> ~/.ssh/known_hosts
          echo "89.169.175.36 ssh-rsa " >> ~/.ssh/known_hosts
          

      - name: Set up SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/app/PythonProject30.1 || mkdir -p /home/${{ secrets.SERVER_USER }}/app/PythonProject30.1 && 
            cat << 'EOF' > .env
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            
            # Django
            DEBUG=True
            
            # Stripe
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_API_VERSION=${{ secrets.STRIPE_API_VERSION }}
            
            # Redis
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_DB=${{ secrets.REDIS_DB }}
            
            EOF
            cat ~/secr.pub | ssh onnych@89.169.176.220 "mkdir -p ~/.ssh && cat >> ~/.ssh/authorized_keys"